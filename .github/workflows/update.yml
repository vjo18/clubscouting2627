name: Update clubdata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/clubs.json']
permissions:
  contents: write
concurrency:
  group: clubscout-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run scrape
      - name: Bewaar gevalideerde gegevens
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_raw public/data
          if ! git diff --cached --quiet; then
            git commit -m 'Werk clubselecties bij via ploegkalenders'
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: clubscout-dashboard
          path: public/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clubscout-diagnostiek
          path: diagnostics/
          if-no-files-found: ignore
