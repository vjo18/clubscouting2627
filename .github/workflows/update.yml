name: Update clubdata
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config/clubs.json', 'scripts/**', '.github/workflows/update.yml']
permissions:
  contents: write
concurrency:
  group: clubscout-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run scrape
      - name: Bewaar brongegevens voor herstel zonder herscrapen
        uses: actions/upload-artifact@v4
        with:
          name: clubscout-brongegevens
          path: data_raw/
          retention-days: 14
      - name: Publiceer op actuele main en bereken dashboard opnieuw
        run: python3 scripts/publish_data.py
      - uses: actions/upload-artifact@v4
        with:
          name: clubscout-dashboard
          path: public/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clubscout-diagnostiek
          path: diagnostics/
          if-no-files-found: ignore


