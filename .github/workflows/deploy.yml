name: Publiceer dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['public/**', 'clubscout/**', '.github/workflows/deploy.yml']
  workflow_run:
    workflows: ['Update clubdata', 'Verwerk geboortejaren']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m clubscout.build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiceer op GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

