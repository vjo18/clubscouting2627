name: Controleer volledig wedstrijdblad
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/capture-fixture.yml']
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - run: npm install --no-audit --no-fund
      - name: Bewaar sportieve HTML als parserfixture
        run: |
          xvfb-run -a node --input-type=module <<'JS'
          import puppeteer from 'puppeteer';
          import fs from 'node:fs';
          const b=await puppeteer.launch({headless:false,args:['--no-sandbox','--disable-setuid-sandbox']});
          try {
            const p=await b.newPage();
            await p.goto('https://www.rbfa.be/nl/wedstrijd/7565360',{waitUntil:'networkidle2',timeout:60000});
            await p.waitForSelector('.opstelling-tabel .player .name',{timeout:45000});
            const html=await p.$$eval('.event-summary,.opstelling-tabel',nodes=>nodes.map(n=>n.outerHTML).join('\n'));
            fs.mkdirSync('tests/fixtures',{recursive:true});
            fs.writeFileSync('tests/fixtures/full-match.html',html);
            console.log(await p.$$eval('.opstelling-tabel table',nodes=>nodes.map(n=>({class:n.className,text:n.innerText.slice(0,600)}))));
          } finally {await b.close();}
          JS
      - name: Bewaar fixture
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/fixtures/full-match.html
          if ! git diff --cached --quiet; then
            git commit -m 'Voeg echt volledig RBFA-wedstrijdblad toe voor minutentests'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
