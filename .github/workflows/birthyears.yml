name: Verwerk geboortejaren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data_raw/birthyears.csv', 'data_raw/birthyear_uploads/**', 'scripts/import_birthyears.py', 'clubscout/birthyears.py']
permissions:
  contents: write
concurrency:
  group: clubscout-update
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/import_birthyears.py
      - name: Publiceer geboortejaren op actuele main
        run: python3 scripts/publish_data.py

