name: Verwerk geboortejaren
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data_raw/birthyears.csv', 'data_raw/birthyear_uploads/**', 'scripts/import_birthyears.py', 'clubscout/birthyears.py']
permissions:
  contents: write
concurrency:
  group: clubscout-update
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 scripts/import_birthyears.py
      - name: Bewaar geboortejaren en dashboard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data_raw/birthyears.csv public/data/players.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verwerk geboortejaren en leeftijdsfilters'
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
