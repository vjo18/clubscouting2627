<!doctype html>
<html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clubscout · Ardooie</title>
<style>
:root{font-family:system-ui,sans-serif;color:#18332c;background:#f2f5f0}body{margin:0}header{background:#173f34;color:white;padding:36px max(5vw,20px)}header small{color:#bdd3c0;letter-spacing:.15em}h1{font-size:38px;margin:10px 0}main{max-width:1300px;margin:25px auto;padding:0 20px}.note{background:#fff5d6;padding:16px;border-radius:10px;color:#635021;line-height:1.5}.controls{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}select,input,button{font:inherit;padding:12px;border:1px solid #cad8cb;border-radius:8px;background:white}button{cursor:pointer}button:hover{background:#e2eee2}.cards{display:flex;gap:14px;flex-wrap:wrap;margin:20px 0}.card{background:white;border-radius:12px;padding:18px;min-width:150px}.card strong{display:block;font-size:27px}.muted{color:#718175;font-size:13px}.tablewrap{overflow:auto;background:white;border-radius:12px}table{width:100%;border-collapse:collapse;font-size:14px}th{text-align:left;background:#e3ece2}th,td{padding:15px;border-bottom:1px solid #e5ebe3;vertical-align:top}td button{padding:0;border:0;text-align:left;color:#1b6652}td small{display:block;margin-top:5px;color:#7a816e}.badge{font-size:12px;background:#e6f1e5;padding:4px 7px;border-radius:5px}.coverage{padding:14px 0;line-height:1.8}.coverage span{display:inline-block;margin-right:15px}dialog{border:0;border-radius:14px;max-width:700px;width:85%;padding:24px}dialog::backdrop{background:#10291eaa}a{color:#266851}.empty{padding:30px}footer{padding:28px 0;color:#728070;font-size:13px}
</style>
<header><small>ARDOOIE · SCOUTING 2026 / 2027</small><h1>De speler binnen zijn club.</h1><div>Competitieselecties over A, B, reserven en U19.</div></header>
<main><div id="notice" class="note">Gegevens laden…</div>
<div class="controls"><select id="club" aria-label="Club"></select><input id="search" placeholder="Zoek een speler…" aria-label="Speler zoeken"><select id="filter" aria-label="Selectiefilter"><option value="all">Alle spelers</option><option value="multi">Bij meerdere ploegen</option><option value="signal">Met scoutsignaal</option></select><button id="export">Exporteer selectie</button></div>
<div class="cards" id="cards"></div><h2>Ploegoverzicht</h2><div class="coverage" id="coverage"></div>
<div class="tablewrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><footer>Een scoutsignaal ondersteunt je beoordeling. Het zegt niets over transferinteresse of officiële speelgerechtigdheid.</footer></main>
<dialog id="detail"><button id="close">Sluiten</button><div id="detailBody"></div></dialog>
<script type="module">
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data,visible=[];
function render(){
 const c=data.clubs.find(c=>c.id===$('club').value),ts=c.teams.filter(t=>t.include),query=$('search').value.toLocaleLowerCase('nl'),filter=$('filter').value;
 visible=data.players.filter(p=>p.club_id===c.id && p.name.toLocaleLowerCase('nl').includes(query) && (filter==='all'||filter==='multi'&&p.multiple_teams||filter==='signal'&&p.signals.length)).sort((a,b)=>a.name.localeCompare(b.name,'nl'));
 $('cards').innerHTML=[['Spelers in selectie',visible.length],['Bij meerdere ploegen',visible.filter(p=>p.multiple_teams).length]].map(([label,n])=>`<div class="card"><strong>${n}</strong>${label}</div>`).join('');
 $('coverage').innerHTML=ts.map(t=>{const x=data.calendarCoverage?.[t.rbfa_team_id];return `<span><b>${esc(t.label)}</b>: ${t.rbfa_team_id?(data.coverage[t.rbfa_team_id]||0)+' bladen':'nog te configureren'}${x?` · ${x.imported}/${x.played} gevonden uitslagen verwerkt`:''}</span>`}).join('')+'<div class="muted">Alleen competitiewedstrijden. Volledige seizoensdekking is nog niet bevestigd.</div>';
 $('head').innerHTML=`<tr><th>Speler / geboortejaar</th>${ts.map(t=>`<th>${esc(t.label)}<small class="muted"> · selecties</small></th>`).join('')}<th>Scoutsignaal</th></tr>`;
 $('body').innerHTML=visible.map((p,i)=>`<tr><td><button data-player="${i}"><b>${esc(p.name)}</b></button><small>${p.birth_year||'Geboortejaar onbekend'}</small></td>${ts.map(t=>{const s=p.teams[t.rbfa_team_id];return `<td>${s?`<b>${s.listed}</b><small>${s.minutes_known_matches?`${s.known_minutes} bekende minuten (${s.minutes_known_matches} bladen)`:'Speelminuten onbekend'}</small>`:'—'}</td>`}).join('')}<td>${p.signals.map(s=>`<small>${esc(s)}</small>`).join('')||'—'}</td></tr>`).join('')||`<tr><td colspan="${ts.length+2}" class="empty">Geen spelers voor deze selectie. Configureer ploegen en importeer wedstrijdbladen.</td></tr>`;
 document.querySelectorAll('[data-player]').forEach(b=>b.onclick=()=>show(visible[Number(b.dataset.player)],c));
}
function show(p,c){
 $('detailBody').innerHTML=`<h2>${esc(p.name)}</h2><p>${esc(c.name)} · ${p.birth_year||'Geboortejaar onbekend'}</p><p>Dezelfde volledige naam binnen deze club wordt automatisch samengevoegd over de ploegen heen.</p><p>Een vermelding bewijst alleen dat de speler op het wedstrijdblad staat. Basis, bank, minuten en goals blijven onbekend bij beperkte verslagen.</p>`+Object.entries(p.teams).map(([tid,s])=>`<h3>${esc(c.teams.find(t=>t.rbfa_team_id===tid)?.label||tid)} · ${s.listed} selecties</h3><ul>${s.matches.map(u=>{let safe=false;try{const x=new URL(u);safe=x.protocol==='https:'&&['rbfa.be','www.rbfa.be'].includes(x.hostname)}catch{}return `<li>${safe?`<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open wedstrijdblad</a>`:esc(u)}</li>`}).join('')}</ul>`).join('');$('detail').showModal();
}
$('close').onclick=()=>$('detail').close();
for(const id of ['club','search','filter'])$(id).addEventListener('input',()=>data&&render());
$('export').onclick=()=>{
 if(!data)return;
 const cell=v=>'"'+String(v??'').replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"';
 const rows=[['Club','Speler','Geboortejaar','Spelerkoppeling','Ploeg','Selecties','Bekende minuten','Bladen met bekende minuten'],...visible.flatMap(p=>Object.entries(p.teams).map(([tid,s])=>{const c=data.clubs.find(c=>c.id===p.club_id);return [c.name,p.name,p.birth_year,'Automatisch op club en naam',c.teams.find(t=>t.rbfa_team_id===tid)?.label,s.listed,s.minutes_known_matches?s.known_minutes:'',s.minutes_known_matches]}))];
 const blob=new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='clubscout-selectie.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
};
try{const r=await fetch('./data/players.json');if(!r.ok)throw Error('Databestand ontbreekt');data=await r.json();$('notice').textContent=data.notice;$('club').innerHTML=data.clubs.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');$('club').value='torhout';render()}catch(e){$('notice').textContent='Laden mislukt: '+e.message+'. Voer python3 -m clubscout.build uit en open via de lokale server.'}
</script></html>
